name: Build, scan and sign

# ---------- 1. When it runs ----------
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Least privilege by default: read the repo, nothing else.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: say-when-app

jobs:
  # ---------- 2. Tests gate everything ----------
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  build:
    name: Build, scan, push and sign (arm64)
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write   # lets this job request an OIDC token (AWS + Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---------- 3. Build and scan (runs on PRs too) ----------
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load locally, don't push yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: say-when-app:ci
          build-args: APP_VERSION=${{ github.sha }}

      - name: Scan with Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: say-when-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---------- 4. Push to ECR (main only) ----------
      - name: Configure AWS credentials (OIDC, no stored keys)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag say-when-app:ci "$IMAGE"
          docker push "$IMAGE"
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      # ---------- 5. SBOM, sign, attest, verify (main only) ----------
      - name: Generate SBOM (SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image and attach SBOM attestation (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST_REF"

      - name: Verify signature
        if: github.event_name != 'pull_request'
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          cosign verify "$DIGEST_REF" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Job summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ✅ Image pushed, signed and attested"
            echo ""
            echo "- **Image:** \`${{ steps.push.outputs.image }}\`"
            echo "- **Digest:** \`${{ steps.push.outputs.digest_ref }}\`"
            echo "- **SBOM:** SPDX, attached as a Cosign attestation"
          } >> "$GITHUB_STEP_SUMMARY"
